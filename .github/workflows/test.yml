name: Run Postman Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fix bin permissions
        run: chmod -R +x node_modules/.bin

      - name: Start local server and wait for it
        run: |
          cp mockApi/db_back_up.yaml mockApi/db_stage.yaml
          ./node_modules/.bin/yaml-server --hotReload=off --autoStart=off --port 3000 --database ./mockApi/db_stage.yaml &
          npm install wait-on --no-save
          chmod +x node_modules/.bin/wait-on
          ./node_modules/.bin/wait-on http://localhost:3000/info --timeout 30000
          
      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: npx newman run store.collection.json -e env.json