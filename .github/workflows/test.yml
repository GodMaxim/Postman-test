name: Run Postman Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Start local server and wait for it
        run: |
          cp mockApi/db_back_up.yaml mockApi/db_stage.yaml
          npm install wait-on --save-dev
          npx yaml-server --hotReload=off --autoStart=off --port 3000 --database ./mockApi/db_stage.yaml &
          npx wait-on http://localhost:3000 --timeout 30000
          
      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: npx newman run store.collection.json --env-var "baseUrl=http://localhost:3000"