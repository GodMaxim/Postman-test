name: Run Postman Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start local server and wait for it
        run: |
          cp mockApi/db_back_up.yaml mockApi/db_stage.yaml
          node ./node_modules/yaml-server/bin/yaml-server --hotReload=off --autoStart=off --port 3000 --database ./mockApi/db_stage.yaml &
          npx wait-on http://localhost:3000/info -t 30000

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: npm run test:api