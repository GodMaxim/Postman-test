name: Run Postman Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start local server and wait for it
        run: |
          cp mockApi/db_back_up.yaml mockApi/db_stage.yaml
          npx yaml-server --hotReload=off --autoStart=off --port 3000 --database ./mockApi/db_stage.yaml &

          counter=0
          until curl -s http://localhost:3000/ || [ $counter -eq 15 ]; do
            counter=$((counter+1))
            echo "Waiting for server... ($counter/15)"
            sleep 1
          done
          
      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: npx newman run store.collection.json --env-var "baseUrl=http://localhost:3000"